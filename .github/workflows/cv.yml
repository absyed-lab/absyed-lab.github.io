name: Build CV PDF

on:
  push:
    paths:
      - 'cv/SyedAbdulBasit_CV.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: SyedAbdulBasit_CV.tex
          working_directory: cv
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/SyedAbdulBasit_CV.pdf
          git commit -m "Build CV PDF" || echo "No changes"
          git push
